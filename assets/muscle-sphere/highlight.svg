<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="highlightGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="highlightBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <g id="highlight">
    <ellipse cx="176" cy="140" rx="110" ry="72" fill="url(#highlightGrad)"
             filter="url(#highlightBlur)" transform="rotate(-20,176,140)"/>
  </g>
</svg>
