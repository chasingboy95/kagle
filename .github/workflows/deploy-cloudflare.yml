name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages project name
        required: true
        default: kagle
        type: string

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this production deployment from the main branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build for Cloudflare Pages
        env:
          DEPLOY_BASE_PATH: /
        run: bun run build

      - name: Check bundle size vs baseline
        run: python3 scripts/check_bundle_size.py

      - name: Validate root deployment paths
        run: bun scripts/check_deployment_paths.mjs /

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ inputs.project_name }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret."
            exit 1
          }
          [[ "$CLOUDFLARE_PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]{0,56}[a-z0-9]$ ]] || {
            echo "::error::Project name must use 2-58 lowercase letters, numbers, or hyphens."
            exit 1
          }

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ inputs.project_name }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: bun

      - name: Add deployment URL to summary
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
