<!-- 1. AURA -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="auraCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8FA3" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#FF9FB0" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#E8A6C8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#D6B8E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGradOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3B6D3" stop-opacity="0"/>
      <stop offset="55%" stop-color="#F3B6D3" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#E7A9CE" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E7A9CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGradMid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0A8C4" stop-opacity="0"/>
      <stop offset="55%" stop-color="#F0A8C4" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#E79BC0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E79BC0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGradInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6A9C7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F6A9C7" stop-opacity="0.10"/>
      <stop offset="85%" stop-color="#EC93BB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC93BB" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlurLarge" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="softBlurMed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softBlurSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <g id="aura">
    <g id="aura-core-glow">
      <circle cx="256" cy="256" r="150" fill="url(#auraCore)" filter="url(#softBlurLarge)"/>
    </g>
    <g id="aura-ring-outer" filter="url(#softBlurLarge)">
      <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGradOuter)" stroke-width="46"/>
    </g>
    <g id="aura-ring-mid" filter="url(#softBlurMed)">
      <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ringGradMid)" stroke-width="34"/>
    </g>
    <g id="aura-ring-inner" filter="url(#softBlurSmall)">
      <circle cx="256" cy="256" r="146" fill="none" stroke="url(#ringGradInner)" stroke-width="24"/>
    </g>
  </g>
</svg>